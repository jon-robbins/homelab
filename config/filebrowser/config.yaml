server:
  port: 80
  baseURL: "/"
  # Share links must include non-443 Caddy HTTPS port
  externalUrl: "https://share.example.homelab.local:8443"
  cacheDir: "/home/filebrowser/data/tmp"
  sources:
    - path: "/srv/hdd"
      name: "HDD"
      config:
        defaultEnabled: true
        createUserDir: false
    - path: "/srv/nvme"
      name: "NVMe"
      config:
        defaultEnabled: true
        createUserDir: false

auth:
  methods:
    password:
      enabled: true
      # No open signup — admin created on first boot / first login flow
      signup: false
