# Example routes: copy to your site as edge/traefik.yml and edit.
# The platform mounts it at /etc/traefik/dynamic/routes.yml; Go templating resolves {{ env "BASE_DOMAIN" }}.
#
# Access is controlled by entryPoints:
# - Routers without entryPoints join only `tailnet` (the default).
# - Join `tunnel` only for routes that should be public via Cloudflare Tunnel.
# - Traefik orders rules by length, so set `priority` when paths overlap.
http:
  routers:
    # Private app: tailnet only. Wildcard certificate on one router serves all subdomains.
    sonarr:
      rule: Host(`{{ env "BASE_DOMAIN" }}`) && PathPrefix(`/sonarr`)
      middlewares: [compress]
      service: sonarr
      tls:
        certResolver: cloudflare
        domains:
          - main: '{{ env "BASE_DOMAIN" }}'
            sans: ['*.{{ env "BASE_DOMAIN" }}']

    # Public app: joins tunnel.
    requests:
      rule: Host(`requests.{{ env "BASE_DOMAIN" }}`)
      entryPoints: [tunnel]
      service: overseerr

    # --- Authentik forward-auth gate ----------------------------------------------------
    # Unauthenticated outpost traffic must bypass the gate with higher priority.
    outpost:
      rule: Host(`gate.{{ env "BASE_DOMAIN" }}`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 1000
      service: authentik

    gated-sonarr:
      rule: Host(`gate.{{ env "BASE_DOMAIN" }}`) && PathPrefix(`/sonarr`)
      priority: 800
      middlewares: [authentik]
      service: sonarr

  middlewares:
    compress:
      compress:
        encodings: [gzip, zstd]

    # authResponseHeadersRegex purges client X-Authentik-* headers before copying the outpost response.
    # If Authentik is unreachable, gated routes fail closed with 500.
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeadersRegex: (?i)^x-authentik-
        maxResponseBodySize: 65536

  services:
    sonarr:
      loadBalancer: {servers: [{url: "http://sonarr:8989"}]}
    overseerr:
      loadBalancer: {servers: [{url: "http://overseerr:5055"}]}
    authentik:
      loadBalancer: {servers: [{url: "http://authentik-server:9000"}]}
