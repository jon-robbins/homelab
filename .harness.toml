# agent-harness config (see github.com/jon-robbins/agent-harness examples/harness.toml).
# Relative paths resolve against this repo.
[harness]
tracker = "../homelab-plans"   # Beads tracker (hp-*)
base_branch = "main"
test_command = "python3 -m pytest -q -p no:cacheprovider tests/boundary tests/ci"  # run by the harness on each commit

[models]  # "model" or "model:effort"
implementer = "gpt-5.6-luna:medium"
reviewer = "gpt-5.6-terra:medium"
implementer_pro = "gpt-5.6-luna:high"   # used after two rejected reviews
reviewer_pro = "gpt-5.6-terra:high"
