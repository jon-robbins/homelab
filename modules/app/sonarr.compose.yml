services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:v4-4.0.0.124-ls2@sha256:d3b8087a67410468cad3d1d40d2266f1cf0d09a2e0114265c78d3c861cab868c
    pids_limit: 500
    networks: [homelab_net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/sonarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_DIR}
        target: /data
        bind: {create_host_path: false}
    labels:
      homelab.state: stateful
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  homelab_net:
    external: true
