services:
  homelab-arr-missing-search:
    image: ghcr.io/jon-robbins/homelab/homelab-workers@sha256:6b5fa615d3fdfcf2f49404ac5683b8d683cabdb442787fc63c2d800bfeefa823
    entrypoint: ["homelab-arr-missing-search"]
    networks: [homelab_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    secrets: [RADARR_API_KEY, SONARR_API_KEY]
    environment: ["TZ=${TZ}", "ARR_MISSING_SEARCH_ENABLED=0", "ARR_MISSING_SEARCH_STATUS_PATH=/state/status.json"]
    labels: {homelab.state: stateless}
    healthcheck:
      test: ["CMD", "homelab-arr-missing-search", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
secrets:
  RADARR_API_KEY: {file: "${HOMELAB_SECRET_DIR}/RADARR_API_KEY"}
  SONARR_API_KEY: {file: "${HOMELAB_SECRET_DIR}/SONARR_API_KEY"}
networks:
  homelab_net: {external: true}
