services:
  navidrome:
    image: ghcr.io/navidrome/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    user: "${PUID}:${PGID}"
    pids_limit: 500
    networks: [homelab_net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      - TZ=${TZ}
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_BASEURL=/navidrome
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/navidrome
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${MUSIC_DIR}
        target: /music
        read_only: true
        bind: {create_host_path: false}
    labels:
      homelab.state: stateful
      homelab.probe: http://:4533/ping
    restart: unless-stopped

networks:
  homelab_net:
    external: true
