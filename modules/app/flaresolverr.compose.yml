services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    mem_limit: 2g
    memswap_limit: 4g
    pids_limit: 500
    networks: [homelab_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    shm_size: "2gb"
    environment: ["LOG_LEVEL=info", "TZ=${TZ}"]
    labels: {homelab.state: stateless}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
