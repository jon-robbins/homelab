services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.89.0@sha256:60efc357e1852f1cd337b8c26d65c5299feadbb4f364c89299b1eede5d159ce4
    mem_limit: 512m
    memswap_limit: 1g
    pids_limit: 200
    networks: [homelab_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment: ["TZ=${TZ}"]
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/autobrr
        target: /config
        bind: {create_host_path: false}
    labels: {homelab.state: stateful}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7474/api/healthz/liveness >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
