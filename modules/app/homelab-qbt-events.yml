services:
  homelab-qbt-events:
    image: ghcr.io/jon-robbins/homelab/homelab-workers@sha256:6b5fa615d3fdfcf2f49404ac5683b8d683cabdb442787fc63c2d800bfeefa823
    entrypoint: ["homelab-qbt-events"]
    command: ["--serve", "--host", "0.0.0.0", "--port", "8101"]
    networks: [homelab_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    secrets: [QBITTORRENT_USERNAME, QBITTORRENT_PASSWORD]
    environment: ["TZ=${TZ}", "QBITTORRENT_INTERNAL_URL=http://qbittorrent:8080", "QBT_EVENTS_SESSION_PATH=/state/session.json", "QBT_EVENTS_STATUS_PATH=/state/status.json", "QBT_EVENTS_REENFORCE_SECONDS=45"]
    labels: {homelab.state: stateless}
    healthcheck:
      test: ["CMD", "homelab-qbt-events", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
secrets:
  QBITTORRENT_USERNAME: {file: "${HOMELAB_SECRET_DIR}/QBITTORRENT_USERNAME"}
  QBITTORRENT_PASSWORD: {file: "${HOMELAB_SECRET_DIR}/QBITTORRENT_PASSWORD"}
networks:
  homelab_net: {external: true}
