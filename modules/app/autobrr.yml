services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.85.0@sha256:f7594d15dfe9a59e7bbc4bce8aee437a1d440d60b350e2ee74331c0d4ec01928
    networks: [homelab_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment: ["TZ=${TZ}"]
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/autobrr
        target: /config
        bind: {create_host_path: false}
    labels: {homelab.state: stateful}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7474/api/healthz/liveness >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
