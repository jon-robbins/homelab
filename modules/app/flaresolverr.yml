services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    networks: [homelab_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    shm_size: "2gb"
    environment: ["LOG_LEVEL=info", "TZ=${TZ}"]
    labels: {homelab.state: stateless}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
