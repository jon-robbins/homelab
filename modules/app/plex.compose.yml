services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.5.11079-b3b13e506-ls330@sha256:01a53d9c7adcbb3701fbb0a4230c0a37c85453759b6b05a67356c3c7a09de08d
    mem_limit: 8g
    memswap_limit: 16g
    pids_limit: 500
    networks: [homelab_net]
    ports: ["32400:32400/tcp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}", "VERSION=docker"]
    gpus: all
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/plex
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MOVIES_DIR}
        target: /movies
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TV_DIR}
        target: /tv
        read_only: true
        bind: {create_host_path: false}
    labels: {homelab.state: stateful}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
