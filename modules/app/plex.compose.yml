services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.4.10903-e5521bd8c-ls328@sha256:fc852e4c21359252896227aaafd48d7f052c0142cbe8e1ac3068d060faeb6d56
    mem_limit: 8g
    memswap_limit: 16g
    pids_limit: 500
    networks: [homelab_net]
    ports: ["32400:32400/tcp"]
    security_opt: ["no-new-privileges:true"]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}", "VERSION=docker"]
    gpus: all
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/plex
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MOVIES_DIR}
        target: /movies
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TV_DIR}
        target: /tv
        read_only: true
        bind: {create_host_path: false}
    labels: {homelab.state: stateful}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
