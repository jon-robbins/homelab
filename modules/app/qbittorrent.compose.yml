services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
    mem_limit: 4g
    memswap_limit: 8g
    pids_limit: 200
    networks: [homelab_net]
    ports: ["51423:51423/tcp", "51423:51423/udp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}", "WEBUI_PORT=8080", "UMASK=002"]
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/qbittorrent/config
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${APP_DATA_DIR}/qbittorrent/torrent-trackers
        target: /torrent-trackers
        bind: {create_host_path: false}
      - type: bind
        source: ${DOWNLOADS_DIR}
        target: /downloads
        bind: {create_host_path: false}
      - type: bind
        source: ${MOVIES_DIR}
        target: /movies
        bind: {create_host_path: false}
      - type: bind
        source: ${TV_DIR}
        target: /tv
        bind: {create_host_path: false}
    labels: {homelab.state: stateful}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
