services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:8f7a1da9644340c737e3211ecc910a416d4295076e6b2824a4afcd1f4e3576e2
    networks: [homelab_net]
    ports: ["51423:51423/tcp", "51423:51423/udp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}", "WEBUI_PORT=8080"]
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/qbittorrent/config
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${APP_DATA_DIR}/qbittorrent/torrent-trackers
        target: /torrent-trackers
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_NVME_PATH}/Incoming
        target: /downloads
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_HDD_PATH}/Movies
        target: /movies
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_HDD_PATH}/TV
        target: /tv
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_HDD_PATH}/.seed/Seeding
        target: /seeding
        bind: {create_host_path: false}
    labels: {homelab.state: stateful}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
networks:
  homelab_net: {external: true}
