services:
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.6@sha256:da89d8338a3b1889800eb033fd61f8d43f7aa9a1c5a042cb5e03d891b1f0c56c
    command: worker
    user: "${PUID}:${PGID}"
    mem_limit: 1g
    memswap_limit: 2g
    pids_limit: 500
    shm_size: 512m
    networks: [homelab_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    secrets: [AUTHENTIK_SECRET_KEY, AUTHENTIK_PG_PASSWORD]
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=file:///run/secrets/AUTHENTIK_PG_PASSWORD
      - AUTHENTIK_SECRET_KEY=file:///run/secrets/AUTHENTIK_SECRET_KEY
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - TZ=${TZ}
    depends_on:
      authentik-postgres: {condition: service_healthy}
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/authentik-server/data
        target: /data
        bind: {create_host_path: false}
    labels: {homelab.state: stateless}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
secrets:
  AUTHENTIK_SECRET_KEY: {file: "${HOMELAB_SECRET_DIR}/AUTHENTIK_SECRET_KEY"}
  AUTHENTIK_PG_PASSWORD: {file: "${HOMELAB_SECRET_DIR}/AUTHENTIK_PG_PASSWORD"}
networks:
  homelab_net: {external: true}
