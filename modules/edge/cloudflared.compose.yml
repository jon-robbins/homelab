services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    network_mode: host
    volumes:
      # Inventory uses a host-managed credentials directory alongside the config file.
      - type: bind
        source: ${APP_DATA_DIR}/cloudflared/credentials
        target: /etc/cloudflared/credentials
        bind: {create_host_path: false}
    configs:
      - source: cloudflared-config
        target: /etc/cloudflared/config.yml
        mode: 0444
    labels:
      homelab.state: stateless
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready", "--url", "http://localhost:20241"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

configs:
  cloudflared-config:
    file: site:edge/config.yml
