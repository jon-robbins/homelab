services:
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "run"]
    network_mode: host
    volumes:
      # Inventory uses a host-managed credentials directory alongside the config file.
      - type: bind
        source: ${APP_DATA_DIR}/cloudflared/credentials
        target: /etc/cloudflared/credentials
        bind: {create_host_path: false}
    configs:
      - source: cloudflared-config
        target: /etc/cloudflared/config.yml
        mode: 0444
    labels:
      homelab.state: stateless
      homelab.probe: http://:20241/ready
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready", "--url", "http://localhost:20241"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

configs:
  cloudflared-config:
    file: site:edge/config.yml
