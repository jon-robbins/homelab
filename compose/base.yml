# Aggregated stack: included by root `docker-compose.yml`.
include:
  - path: network.yml
  - path: arr.yml
  - path: media.yml
  - path: download.yml
  - path: workers.yml
  - path: autobrr.yml

networks:
  homelab_net:
    name: homelab_net
    external: true
  llm_net:
    internal: true

secrets:
  CLOUDFLARE_TOKEN:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/CLOUDFLARE_TOKEN
  TMDB_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/TMDB_API_KEY
  GEMINI_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/GEMINI_API_KEY
  MCP_API_TOKEN:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/MCP_API_TOKEN
  MEDIA_AGENT_TOKEN:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/MEDIA_AGENT_TOKEN
  HOMELAB_AGENT_API_TOKEN:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/HOMELAB_AGENT_API_TOKEN
  VLLM_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/VLLM_API_KEY
  QBITTORRENT_USERNAME:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/QBITTORRENT_USERNAME
  QBITTORRENT_PASSWORD:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/QBITTORRENT_PASSWORD
  SONARR_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/SONARR_API_KEY
  RADARR_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/RADARR_API_KEY
  PROWLARR_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/PROWLARR_API_KEY
  OVERSEERR_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/OVERSEERR_API_KEY
  AUTOBRR_API_KEY:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/AUTOBRR_API_KEY
  PLEX_TOKEN:
    file: ${HOMELAB_SECRET_DIR:-./example-secrets}/PLEX_TOKEN
