x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  filebrowser:
    image: gtstef/filebrowser@sha256:fc213590ebc090cb8205125cd3ecdfa9066b9ed4a0b53fe2570972d6a3379e73
    networks:
      - homelab_net
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    user: "1000:1000"
    environment:
      - TZ=${TZ:-UTC}
      - FILEBROWSER_CONFIG=/config/config.yaml
    volumes:
      - ../config/filebrowser/config.yaml:/config/config.yaml:ro
      - ${APP_DATA_DIR:-../data}/filebrowser:/home/filebrowser/data
      - ${MEDIA_HDD_PATH:-./example-data/media-hdd}:/srv/hdd:ro
      - ${MEDIA_NVME_PATH:-./example-data/media-nvme}:/srv/nvme:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    pids_limit: 256
