x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    build:
      context: ../config/caddy
      dockerfile: Dockerfile
    image: ${CADDY_IMAGE:-local/caddy-cf:latest}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    # Tailscale :443 must wait for tailscale0 — see scripts/ops/start-tailscale-bound-services.sh
    # (Docker cannot bind ${TAILSCALE_IP} before the address exists; that aborts :80/:8443 too.)
    ports:
      - "80:80"
      - "8443:443"
      - "${TAILSCALE_IP:-127.0.0.1}:443:443"
    volumes:
      - ../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APP_DATA_DIR:-../data}/caddy/data:/data
      - ${APP_DATA_DIR:-../data}/caddy/config:/config
    secrets:
      - CLOUDFLARE_TOKEN
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
    networks:
      - homelab_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    network_mode: host
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 run
    volumes:
      - ${CLOUDFLARED_CONFIG_PATH:-${APP_DATA_DIR:-../data}/cloudflared/config.yml}:/etc/cloudflared/config.yml:ro
      - ${APP_DATA_DIR:-../data}/cloudflared/credentials:/etc/cloudflared/credentials
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready", "--url", "http://localhost:20241"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:stable@sha256:dbeff02d2337344b351afac203427218c4d0a06c43fc10a865184063498472a6
    hostname: ${SITE_HOSTNAME:-homelab-example}
    network_mode: host
    security_opt: ["no-new-privileges:true"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${APP_DATA_DIR:-../data}/tailscale:/var/lib/tailscale
    command: >
      tailscaled
      --state=/var/lib/tailscale/tailscaled.state
      --statedir=/var/lib/tailscale
      --socket=/tmp/tailscaled.sock
    logging: *default-logging
    restart: unless-stopped
