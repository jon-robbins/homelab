x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  internal-dashboard:
    image: nginxinc/nginx-unprivileged:alpine@sha256:19c132c9ab02d3b783f478743dafc7a7f42e27aa7d2bdcbec1bb1128ca8f2a07
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - ${APP_DATA_DIR:-../data}/internal-dashboard:/usr/share/nginx/html:ro
    networks: [homelab_net]
    logging: *default-logging

  homelab-mcp:
    build:
      context: ..
      dockerfile: apps/homelab-mcp/Dockerfile
    image: local/homelab-mcp:latest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    secrets:
      - AUTOBRR_API_KEY
      - MCP_API_TOKEN
      - MEDIA_AGENT_TOKEN
      - OVERSEERR_API_KEY
      - PLEX_TOKEN
      - PROWLARR_API_KEY
      - QBITTORRENT_PASSWORD
      - QBITTORRENT_USERNAME
      - RADARR_API_KEY
      - SONARR_API_KEY
    ports: ["${TAILSCALE_IP:-127.0.0.1}:${HOMELAB_MCP_PORT:-8090}:8090"]
    environment:
      HOMELAB_MCP_HOST: 0.0.0.0
      HOMELAB_MCP_PORT: ${HOMELAB_MCP_PORT:-8090}
      HOMELAB_MCP_ENABLE_MUTATIONS: ${HOMELAB_MCP_ENABLE_MUTATIONS:-0}
      HOMELAB_MCP_AUDIT_PATH: /data/audit.jsonl
      HOMELAB_MCP_EXTENSIONS: ${HOMELAB_MCP_EXTENSIONS:-}
    volumes:
      - ${APP_DATA_DIR:-../data}/homelab-mcp:/data
    networks: [homelab_net]
    logging: *default-logging

  media-agent:
    build:
      context: ../apps/media-agent
    image: local/media-agent:latest
    restart: unless-stopped
    secrets:
      - GEMINI_API_KEY
      - MEDIA_AGENT_TOKEN
      - PROWLARR_API_KEY
      - QBITTORRENT_PASSWORD
      - QBITTORRENT_USERNAME
      - RADARR_API_KEY
      - SONARR_API_KEY
    environment:
      TZ: ${TZ:-UTC}
      SONARR_URL: ${SONARR_INTERNAL_URL:-http://sonarr:8989}
      RADARR_URL: ${RADARR_INTERNAL_URL:-http://radarr:7878}
      PROWLARR_URL: ${PROWLARR_INTERNAL_URL:-http://prowlarr:9696}
    networks: [homelab_net, llm_net]
    logging: *default-logging

  homelab-agent:
    build:
      context: ../apps/homelab-agent
    image: local/homelab-agent:latest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    secrets:
      - HOMELAB_AGENT_API_TOKEN
      - MCP_API_TOKEN
      - VLLM_API_KEY
    environment:
      HOMELAB_AGENT_MODEL_BASE_URL: ${HOMELAB_AGENT_MODEL_BASE_URL:-http://model:8000/v1}
      HOMELAB_AGENT_MODEL_NAME: ${HOMELAB_AGENT_MODEL_NAME:-example-model}
      HOMELAB_AGENT_MCP_URL: http://homelab-mcp:8090
    volumes:
      - ${APP_DATA_DIR:-../data}/homelab-agent:/data
    networks: [homelab_net]
    logging: *default-logging
