x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  plex:
    image: lscr.io/linuxserver/plex@sha256:507713a14f9586f827d00c81381ecdcd438009172342b322b62a0e2b65081fdf
    networks:
      - homelab_net
    ports:
      - "32400:32400/tcp"
    security_opt: ["no-new-privileges:true"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    gpus: all
    volumes:
      - ${APP_DATA_DIR:-../data}/plex:/config
      - ${MEDIA_HDD_PATH:-/mnt/media-hdd}:/mnt/media-hdd:ro
      - ${MEDIA_NVME_PATH:-/mnt/media-nvme}:/mnt/media-nvme:ro
      - ${PLEX_DATA_PATH:-./example-data/plex}:/srv/plex
      - ${MEDIA_HDD_PATH:-/mnt/media-hdd}/Movies:/movies:ro
      - ${MEDIA_HDD_PATH:-/mnt/media-hdd}/TV:/tv:ro
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 8g
    pids_limit: 500

  jellyfin:
    image: lscr.io/linuxserver/jellyfin@sha256:ae1ac3d89b8598f31f5e1dc5aff898e13eab617303db58f84956e26f7b78c198
    networks:
      - homelab_net
    ports:
      - "8096:8096/tcp"
    security_opt: ["no-new-privileges:true"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${BASE_DOMAIN}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    gpus: all
    volumes:
      - ${APP_DATA_DIR:-../data}/jellyfin:/config
      - ${MEDIA_HDD_PATH:-/mnt/media-hdd}/Movies:/movies:ro
      - ${MEDIA_HDD_PATH:-/mnt/media-hdd}/TV:/tv:ro
      - ${MEDIA_NVME_PATH:-/mnt/media-nvme}/Incoming:/downloads:ro
      - ${MEDIA_HDD_PATH:-/mnt/media-hdd}:/mnt/media-hdd:ro
      - ${MEDIA_NVME_PATH:-/mnt/media-nvme}:/mnt/media-nvme:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 500

  homelab-seerr-request-reconciler:
    build:
      context: ../apps/homelab-workers
      dockerfile: Dockerfile
    entrypoint: ["homelab-seerr-request-reconciler"]
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    secrets:
      - QBITTORRENT_USERNAME
      - QBITTORRENT_PASSWORD
      - SONARR_API_KEY
      - RADARR_API_KEY
      - PROWLARR_API_KEY
      - OVERSEERR_API_KEY
    networks:
      - homelab_net
    environment:
      - TZ=${TZ}
      - SEERR_RECONCILER_ENABLED=${SEERR_RECONCILER_ENABLED:-0}
      - SEERR_RECONCILER_FALLBACK_ENABLED=${SEERR_RECONCILER_FALLBACK_ENABLED:-0}
      - SEERR_RECONCILER_LOOKBACK_HOURS=${SEERR_RECONCILER_LOOKBACK_HOURS:-24}
      - SEERR_RECONCILER_INTERVAL_SECONDS=${SEERR_RECONCILER_INTERVAL_SECONDS:-300}
      - SEERR_RECONCILER_GRACE_SECONDS=${SEERR_RECONCILER_GRACE_SECONDS:-900}
      - SEERR_RECONCILER_SEARCH_COOLDOWN_SECONDS=${SEERR_RECONCILER_SEARCH_COOLDOWN_SECONDS:-3600}
      - SEERR_RECONCILER_STATUS_PATH=/state/status.json
      - SEERR_RECONCILER_STATE_PATH=/state/state.json
      - SEERR_RECONCILER_STATUS_MAX_AGE_SECONDS=${SEERR_RECONCILER_STATUS_MAX_AGE_SECONDS:-900}
      # Service credentials arrive as /run/secrets files (Infisical via the
      # secrets: block) and are hydrated in-app by bootstrap_container_secrets();
      # do not re-inject them through environment.
      - OVERSEERR_INTERNAL_URL=${OVERSEERR_INTERNAL_URL:-http://overseerr:5055}
      - SONARR_INTERNAL_URL=${SONARR_INTERNAL_URL:-http://sonarr:8989/sonarr}
      - RADARR_INTERNAL_URL=${RADARR_INTERNAL_URL:-http://radarr:7878/radarr}
      - PROWLARR_INTERNAL_URL=${PROWLARR_INTERNAL_URL:-http://prowlarr:9696/prowlarr}
      - QBITTORRENT_INTERNAL_URL=${QBITTORRENT_INTERNAL_URL:-http://qbittorrent:8080}
    volumes:
      - ${APP_DATA_DIR:-../data}/seerr-request-reconciler:/state
    healthcheck:
      test: ["CMD", "homelab-seerr-request-reconciler", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
