[project]
name = "homelab-mcp"
version = "0.8.0"
description = "MCP server for homelab diagnostics and gated maintenance mutations"
requires-python = ">=3.11"
dependencies = [
    "homelab-workers==0.1.0",
    "mcp>=1.9.0,<2",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Install homelab-workers as editable alongside this package during local dev:
#   .venv/bin/pip install -e ../homelab-workers -e ".[dev]"
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.4,<0.16"]

[project.scripts]
homelab-mcp = "homelab_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["src/homelab_mcp/tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["src/homelab_mcp/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.per-file-ignores]
"src/homelab_mcp/capabilities.py" = ["C901"]
"src/homelab_mcp/diagnostics/autobrr_pipeline.py" = ["C901"]
"src/homelab_mcp/evidence.py" = ["C901"]
"src/homelab_mcp/tools/media.py" = ["C901"]
"src/homelab_mcp/tools/mutations/media_downloads.py" = ["C901"]
"src/homelab_mcp/tools/mutations/qbt.py" = ["C901"]
"src/homelab_mcp/tools/plex.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
