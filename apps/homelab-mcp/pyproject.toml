[project]
name = "homelab-mcp"
version = "0.8.0"
description = "MCP server for homelab diagnostics and gated maintenance mutations"
requires-python = ">=3.11"
dependencies = [
    "homelab-workers==0.1.0",
    "mcp>=1.9.0,<2",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Install homelab-workers as editable alongside this package during local dev:
#   .venv/bin/pip install -e ../homelab-workers -e ".[dev]"
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.4"]

[project.scripts]
homelab-mcp = "homelab_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["src/homelab_mcp/tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["src/homelab_mcp/tests/**"]
