name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ── Fast static validation (every push, no containers) ─────────────────────
  validate:
    runs-on: ubuntu-latest
    env:
      SKIP_HOST_PORT_PREFLIGHT: "1"
      COMPOSE_ENV_FILES: "/dev/null"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Create workers environment
        run: |
          set -euo pipefail
          WORKERS_DIR="${GITHUB_WORKSPACE}/apps/homelab-workers"
          python3 -m venv "${WORKERS_DIR}/.venv"
          "${WORKERS_DIR}/.venv/bin/pip" install -e "${WORKERS_DIR}[dev]"
          echo "${GITHUB_WORKSPACE}/apps/homelab-workers/.venv/bin" >> "${GITHUB_PATH}"

      - name: Workflow security policy
        run: python3 -m pytest -q tests/ci/test_workflow_security.py

      - name: Release pytest
        run: python3 -m pytest -q tests/release

      - name: Compose config with synthetic secrets
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/compose-config-check.sh"

      - name: Compose shell tests
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/run-compose-tests.sh"

      - name: Ops shell tests
        run: bash "${GITHUB_WORKSPACE}/tests/ops/run_tests.sh"

      - name: Package pytest
        run: python3 -m pytest -q apps/homelab-workers/src/homelab_workers/tests

      - name: MCP pytest
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/mcp-venv"
          "${RUNNER_TEMP}/mcp-venv/bin/pip" install -q "${GITHUB_WORKSPACE}/apps/homelab-workers" \
            -e "${GITHUB_WORKSPACE}/apps/homelab-mcp" pytest pytest-asyncio pytest-httpx respx
          cd "${GITHUB_WORKSPACE}/apps/homelab-mcp"
          "${RUNNER_TEMP}/mcp-venv/bin/python" -m pytest -q

      - name: Package ruff
        run: ruff check apps/homelab-workers/src apps/homelab-workers/src/homelab_workers/tests

      - name: Create media agent environment
        run: |
          set -euo pipefail
          MEDIA_DIR="${GITHUB_WORKSPACE}/apps/media-agent"
          python3 -m venv "${MEDIA_DIR}/.venv"
          "${MEDIA_DIR}/.venv/bin/pip" install -e "${MEDIA_DIR}[dev]"
          echo "${GITHUB_WORKSPACE}/apps/media-agent/.venv/bin" >> "${GITHUB_PATH}"

      - name: Media agent pytest
        env:
          PYTHONWARNINGS: "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
        run: python3 -m pytest -W "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning" -q apps/media-agent/tests

      - name: Media agent ruff
        run: ruff check apps/media-agent/app apps/media-agent/tests

      - name: Bash syntax
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          scripts=(
            "${GITHUB_WORKSPACE}"/scripts/ci/*.sh
            "${GITHUB_WORKSPACE}"/scripts/ops/*.sh
            "${GITHUB_WORKSPACE}"/scripts/hardening/*.sh
            "${GITHUB_WORKSPACE}"/tests/compose/*.sh
            "${GITHUB_WORKSPACE}"/tests/runtime/*.sh
            "${GITHUB_WORKSPACE}"/tests/integration/*.sh
          )
          for script in "${scripts[@]}"; do
            [[ -f "${script}" ]] && bash -n "${script}" && echo "OK  ${script#${GITHUB_WORKSPACE}/}"
          done

      - name: README mermaid blocks
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          readme = Path("README.md")
          if not readme.exists():
              print("README.md missing", file=sys.stderr)
              sys.exit(1)

          content = readme.read_text(encoding="utf-8")
          count = len(re.findall(r"```mermaid", content))
          if count < 1:
              print("README must contain at least one mermaid block", file=sys.stderr)
              sys.exit(1)
          PY

  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Scan checkout with gitleaks
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:v8.28.0
          detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact

  image-builds:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: apps/homelab-agent/Dockerfile
            context: apps/homelab-agent
          - dockerfile: apps/homelab-mcp/Dockerfile
            context: .
          - dockerfile: apps/homelab-workers/Dockerfile
            context: apps/homelab-workers
          - dockerfile: apps/media-agent/Dockerfile
            context: apps/media-agent
          - dockerfile: apps/qwen-code-telegram/Dockerfile
            context: apps/qwen-code-telegram
          - dockerfile: apps/qwen-serve/Dockerfile
            context: apps/qwen-serve
          - dockerfile: config/caddy/Dockerfile
            context: config/caddy
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build image without push
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "ci-${{ strategy.job-index }}"
          "${{ matrix.context }}"

  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Public readiness
        run: python3 scripts/ci/public-readiness.py
