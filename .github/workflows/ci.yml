name: CI

on:
  pull_request: {}
  push:
    # Milestone branches (m-*) get full CI on every bead push, before their PR exists.
    branches: [main, "m-*"]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hook dependencies
        run: |
          python -m pip install pre-commit==4.2.0 nox==2025.2.9
      - name: Run pre-commit
        run: pre-commit run --all-files

  session-list:
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.sessions.outputs.sessions }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install nox
        run: python -m pip install nox==2025.2.9
      - name: List nox sessions
        id: sessions
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          data = json.loads(subprocess.check_output(["nox", "--list", "--json"], text=True))
          entries = data if isinstance(data, list) else data["sessions"]
          sessions = [item["session"] for item in entries]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sessions=" + json.dumps(sessions) + "\n")
          PY

  nox-sessions:
    needs: session-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.session-list.outputs.sessions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install nox
        run: python -m pip install nox==2025.2.9
      - name: Run session
        env:
          SKIP_HOST_PORT_PREFLIGHT: "1"
          COMPOSE_ENV_FILES: /dev/null
          NOX_SESSION: ${{ matrix.session }}
        run: nox -s "$NOX_SESSION"

  validate:
    if: always()
    needs: [pre-commit, nox-sessions]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required jobs
        env:
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          NOX_RESULT: ${{ needs.nox-sessions.result }}
        run: |
          test "$PRE_COMMIT_RESULT" = success
          test "$NOX_RESULT" = success

  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan checkout with gitleaks
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:v8.28.0
          detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install zizmor
        run: python3 -m pip install zizmor==1.8.0
      - name: Audit workflows
        run: zizmor .github/workflows

  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinact
        run: go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0
      - name: Verify action pins
        run: '"$(go env GOPATH)/bin/pinact" run --check --fix=false --no-api'

  image-builds:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dockerfile: apps/homelab-agent/Dockerfile, context: apps/homelab-agent}
          - {dockerfile: apps/homelab-mcp/Dockerfile, context: .}
          - {dockerfile: apps/homelab-workers/Dockerfile, context: apps/homelab-workers}
          - {dockerfile: apps/media-agent/Dockerfile, context: apps/media-agent}
          - {dockerfile: apps/qwen-code-telegram/Dockerfile, context: apps/qwen-code-telegram}
          - {dockerfile: apps/qwen-serve/Dockerfile, context: apps/qwen-serve}
          - {dockerfile: config/caddy/Dockerfile, context: config/caddy}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image without push
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: docker build --file "$DOCKERFILE" --tag "ci-$JOB_INDEX" "$BUILD_CONTEXT"

  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Public readiness
        run: python3 scripts/ci/public-readiness.py
