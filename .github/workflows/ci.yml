name: CI

on:
  pull_request: {}
  push:
    # Milestone branches (m-*) get full CI on every bead push, before their PR exists.
    branches: [main, "m-*"]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hook dependencies
        run: |
          python -m pip install pre-commit==4.2.0 nox==2025.2.9
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Check complexity budgets
        run: python scripts/ci/complexity_budget.py

  session-list:
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.sessions.outputs.sessions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install nox
        run: python -m pip install nox==2025.2.9
      - name: List nox sessions
        id: sessions
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          data = json.loads(subprocess.check_output(["nox", "--list", "--json"], text=True))
          entries = data if isinstance(data, list) else data["sessions"]
          sessions = [item["session"] for item in entries]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sessions=" + json.dumps(sessions) + "\n")
          PY

  nox-sessions:
    needs: session-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.session-list.outputs.sessions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install nox
        run: python -m pip install nox==2025.2.9
      - name: Run session
        env:
          SKIP_HOST_PORT_PREFLIGHT: "1"
          COMPOSE_ENV_FILES: /dev/null
          NOX_SESSION: ${{ matrix.session }}
        run: nox -s "$NOX_SESSION"

  validate:
    if: always()
    needs: [pre-commit, nox-sessions]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required jobs
        env:
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          NOX_RESULT: ${{ needs.nox-sessions.result }}
        run: |
          test "$PRE_COMMIT_RESULT" = success
          test "$NOX_RESULT" = success

  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan checkout with gitleaks
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:v8.28.0
          detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: python3 -m pip install zizmor==1.8.0
      - name: Audit workflows
        run: zizmor .github/workflows

  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinact
        run: go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0
      - name: Verify action pins
        run: '"$(go env GOPATH)/bin/pinact" run --check --fix=false --no-api'

  image-builds:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dockerfile: config/caddy/Dockerfile, context: config/caddy, cap_drop_check: true}
          - {dockerfile: build/seerr-oidc/context/Dockerfile, context: build/seerr-oidc/context, prepare: config/seerr-oidc/build.py, prepare_destination: build/seerr-oidc, source_lock: config/seerr-oidc/source.json, cap_drop_check: false}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified image source
        if: matrix.prepare
        env:
          PREPARE_SCRIPT: ${{ matrix.prepare }}
          PREPARE_DESTINATION: ${{ matrix.prepare_destination }}
        run: python3 "$PREPARE_SCRIPT" "$PREPARE_DESTINATION" --prepare-only
      - name: Build image without push
        env:
          SOURCE_LOCK: ${{ matrix.source_lock }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          build_args=()
          if [[ -n "$SOURCE_LOCK" ]]; then
            build_args+=(
              --platform linux/amd64
              --build-arg "COMMIT_TAG=$(jq -r .commit "$SOURCE_LOCK")"
              --label "org.opencontainers.image.source=$(jq -r .repository "$SOURCE_LOCK")"
              --label "org.opencontainers.image.revision=$(jq -r .commit "$SOURCE_LOCK")"
              --label "io.homelab.node-base=$(jq -r .node_image "$SOURCE_LOCK")"
            )
          fi
          docker build "${build_args[@]}" --file "$DOCKERFILE" --tag "ci-$JOB_INDEX" "$BUILD_CONTEXT"
      - name: Start Caddy without capabilities
        if: matrix.cap_drop_check
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: docker run --rm --cap-drop ALL --security-opt no-new-privileges:true "ci-$JOB_INDEX" version

  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public readiness
        run: python3 scripts/ci/public-readiness.py
