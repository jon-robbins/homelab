name: Post-merge credential-free builds

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changed-images:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Find changed images
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            homelab-agent:
              - 'apps/homelab-agent/**'
              - 'apps/homelab-agent/Dockerfile'
            homelab-mcp:
              - 'apps/homelab-mcp/**'
              - 'apps/homelab-mcp/Dockerfile'
              - 'apps/homelab-workers/**'
            homelab-workers:
              - 'apps/homelab-workers/**'
              - 'apps/homelab-workers/Dockerfile'
            media-agent:
              - 'apps/media-agent/**'
              - 'apps/media-agent/Dockerfile'
            qwen-code-telegram:
              - 'apps/qwen-code-telegram/**'
              - 'apps/qwen-code-telegram/Dockerfile'
            qwen-serve:
              - 'apps/qwen-serve/**'
              - 'apps/qwen-serve/Dockerfile'
            caddy:
              - 'config/caddy/**'
              - 'config/caddy/Dockerfile'
      - name: Create build matrix
        id: matrix
        env:
          FILTER_HOMELAB_AGENT: ${{ steps.filter.outputs.homelab-agent }}
          FILTER_HOMELAB_MCP: ${{ steps.filter.outputs.homelab-mcp }}
          FILTER_HOMELAB_WORKERS: ${{ steps.filter.outputs.homelab-workers }}
          FILTER_MEDIA_AGENT: ${{ steps.filter.outputs.media-agent }}
          FILTER_QWEN_CODE_TELEGRAM: ${{ steps.filter.outputs.qwen-code-telegram }}
          FILTER_QWEN_SERVE: ${{ steps.filter.outputs.qwen-serve }}
          FILTER_CADDY: ${{ steps.filter.outputs.caddy }}
        run: |
          matrix=$(jq -cn '[
            {"dockerfile":"apps/homelab-agent/Dockerfile","context":"apps/homelab-agent","image":"homelab-agent","changed":env.FILTER_HOMELAB_AGENT},
            {"dockerfile":"apps/homelab-mcp/Dockerfile","context":".","image":"homelab-mcp","changed":env.FILTER_HOMELAB_MCP},
            {"dockerfile":"apps/homelab-workers/Dockerfile","context":"apps/homelab-workers","image":"homelab-workers","changed":env.FILTER_HOMELAB_WORKERS},
            {"dockerfile":"apps/media-agent/Dockerfile","context":"apps/media-agent","image":"media-agent","changed":env.FILTER_MEDIA_AGENT},
            {"dockerfile":"apps/qwen-code-telegram/Dockerfile","context":"apps/qwen-code-telegram","image":"qwen-code-telegram","changed":env.FILTER_QWEN_CODE_TELEGRAM},
            {"dockerfile":"apps/qwen-serve/Dockerfile","context":"apps/qwen-serve","image":"qwen-serve","changed":env.FILTER_QWEN_SERVE},
            {"dockerfile":"config/caddy/Dockerfile","context":"config/caddy","image":"caddy","changed":env.FILTER_CADDY}
          ] | map(select(.changed == "true") | del(.changed)) | {include:.}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: changed-images
    if: needs.changed-images.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed-images.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Free runner disk space
        # Large CUDA images (qwen-serve) exceed the default free disk once exported as an OCI archive.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build OCI layout
        run: >-
          docker buildx build
          --platform linux/amd64
          --file "${{ matrix.dockerfile }}"
          --output "type=oci,dest=oci-layout.tar"
          "${{ matrix.context }}"

      - name: Attest OCI layout
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: oci-layout.tar

      - name: Upload OCI artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: oci-${{ matrix.image }}
          path: oci-layout.tar
          if-no-files-found: error
