name: Post-merge credential-free builds

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changed-images:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find changed images
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A change to the build recipe or the approved image list rebuilds every
          # image, so one push yields a full verified set (also the first-release bootstrap).
          filters: |
            recipe:
              - '.github/workflows/post-merge-build.yml'
              - 'config/release/approved-ghcr-destinations.json'
            caddy:
              - 'config/caddy/**'
              - 'config/caddy/Dockerfile'
            seerr-oidc:
              - 'config/seerr-oidc/**'
      - name: Create build matrix
        id: matrix
        env:
          FILTER_CADDY: ${{ steps.filter.outputs.caddy }}
          FILTER_SEERR_OIDC: ${{ steps.filter.outputs.seerr-oidc }}
          FILTER_RECIPE: ${{ steps.filter.outputs.recipe }}
        run: |
          matrix=$(jq -cn '[
            {"dockerfile":"config/caddy/Dockerfile","context":"config/caddy","image":"caddy","changed":env.FILTER_CADDY},
            {"dockerfile":"build/seerr-oidc/context/Dockerfile","context":"build/seerr-oidc/context","image":"seerr-oidc","prepare":"config/seerr-oidc/build.py","prepare_destination":"build/seerr-oidc","source_lock":"config/seerr-oidc/source.json","changed":env.FILTER_SEERR_OIDC}
          ] | map(select(.changed == "true" or env.FILTER_RECIPE == "true") | del(.changed)) | {include:.}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: changed-images
    if: needs.changed-images.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed-images.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare verified image source
        if: matrix.prepare
        env:
          PREPARE_SCRIPT: ${{ matrix.prepare }}
          PREPARE_DESTINATION: ${{ matrix.prepare_destination }}
        run: python3 "$PREPARE_SCRIPT" "$PREPARE_DESTINATION" --prepare-only

      - name: Build OCI layout
        env:
          SOURCE_LOCK: ${{ matrix.source_lock }}
          BUILD_DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          build_args=()
          if [[ -n "$SOURCE_LOCK" ]]; then
            build_args+=(
              --build-arg "COMMIT_TAG=$(jq -r .commit "$SOURCE_LOCK")"
              --label "org.opencontainers.image.source=$(jq -r .repository "$SOURCE_LOCK")"
              --label "org.opencontainers.image.revision=$(jq -r .commit "$SOURCE_LOCK")"
              --label "io.homelab.node-base=$(jq -r .node_image "$SOURCE_LOCK")"
            )
          fi
          docker buildx build "${build_args[@]}" \
            --platform linux/amd64 \
            --file "$BUILD_DOCKERFILE" \
            --output "type=oci,dest=oci-layout.tar" \
            "$BUILD_CONTEXT"

      - name: Attest OCI layout
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.3.0
        with:
          subject-path: oci-layout.tar

      - name: Upload OCI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.image }}
          path: oci-layout.tar
          if-no-files-found: error
