name: Post-merge credential-free builds

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changed-images:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find changed images
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A change to the build recipe or the approved image list rebuilds every
          # image, so one push yields a full verified set (also the first-release bootstrap).
          filters: |
            recipe:
              - '.github/workflows/post-merge-build.yml'
              - 'config/release/approved-ghcr-destinations.json'
            homelab-workers:
              - 'apps/homelab-workers/**'
              - 'apps/homelab-workers/Dockerfile'
            caddy:
              - 'config/caddy/**'
              - 'config/caddy/Dockerfile'
      - name: Create build matrix
        id: matrix
        env:
          FILTER_HOMELAB_WORKERS: ${{ steps.filter.outputs.homelab-workers }}
          FILTER_CADDY: ${{ steps.filter.outputs.caddy }}
          FILTER_RECIPE: ${{ steps.filter.outputs.recipe }}
        run: |
          matrix=$(jq -cn '[
            {"dockerfile":"apps/homelab-workers/Dockerfile","context":"apps/homelab-workers","image":"homelab-workers","changed":env.FILTER_HOMELAB_WORKERS},
            {"dockerfile":"config/caddy/Dockerfile","context":"config/caddy","image":"caddy","changed":env.FILTER_CADDY}
          ] | map(select(.changed == "true" or env.FILTER_RECIPE == "true") | del(.changed)) | {include:.}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: changed-images
    if: needs.changed-images.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed-images.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build OCI layout
        env:
          BUILD_DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: >-
          docker buildx build
          --platform linux/amd64
          --file "$BUILD_DOCKERFILE"
          --output "type=oci,dest=oci-layout.tar"
          "$BUILD_CONTEXT"

      - name: Attest OCI layout
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.3.0
        with:
          subject-path: oci-layout.tar

      - name: Upload OCI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.image }}
          path: oci-layout.tar
          if-no-files-found: error
