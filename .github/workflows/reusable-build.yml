name: Reusable credential-free OCI build

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Free runner disk space
        # Large CUDA images (qwen-serve) exceed the default free disk once exported as an OCI archive.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build OCI layout
        run: >-
          docker buildx build
          --platform linux/amd64
          --file "${{ inputs.dockerfile }}"
          --output "type=oci,dest=oci-layout.tar"
          "${{ inputs.context }}"

      - name: Record build provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ inputs.image }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile

          with tarfile.open("oci-layout.tar", "r:") as archive:
              index = json.load(archive.extractfile("index.json"))
          manifest_digest = index["manifests"][0]["digest"]
          provenance = {
              "schema": 1,
              "repository": os.environ["REPOSITORY"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "image": os.environ["IMAGE"],
              "manifest_digest": manifest_digest,
              "built_at": os.environ.get("SOURCE_DATE_EPOCH", "1970-01-01T00:00:00Z"),
          }
          with open("provenance.json", "w", encoding="utf-8") as output:
              json.dump(provenance, output, sort_keys=True)
          PY

      - name: Upload OCI artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            oci-layout.tar
            provenance.json
          if-no-files-found: error
