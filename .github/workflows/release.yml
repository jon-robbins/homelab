name: Release reconciler

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-reconciler
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      actions: read
    env:
      PRIVATE_INPUT_READ_TOKEN: ${{ secrets.PRIVATE_INPUT_READ_TOKEN }}
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release inputs
        id: plan
        run: python3 -m scripts.release.reconcile plan --output release-plan.json
      - name: Upload release plan
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4806
        with:
          name: release-plan
          path: release-plan.json

    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      run_id: ${{ steps.plan.outputs.run_id }}
      images: ${{ steps.plan.outputs.images }}
      has-images: ${{ steps.plan.outputs.has_images }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.verify.outputs.images) }}
    uses: ./.github/workflows/reusable-publish.yml
    with:
      artifact-name: ${{ matrix.image.artifact_name }}
      destination: ${{ matrix.image.destination }}
      manifest-digest: ${{ matrix.image.manifest_digest }}
      run-id: ${{ needs.verify.outputs.run_id }}
    permissions:
      contents: read
      actions: read
      packages: write
    environment: production-release

  sign:
    if: github.ref == 'refs/heads/main'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
    env:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      RELEASE_COMPOSE: release/compose.json
      RELEASE_MANIFEST: release/manifest.yaml
      RELEASE_PROBES: release/probes.json
      RELEASE_POLICY: release/policy.yaml
      RELEASE_FILES: release/files
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Download release plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan
      - name: Build and sign release record
        run: python3 -m scripts.release.reconcile sign --plan release-plan.json --output-dir release-output
      - name: Upload signed release
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4806
        with:
          name: signed-release
          path: release-output

  feed:
    if: github.ref == 'refs/heads/main'
    needs: sign
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
    env:
      SITE_FEED_TOKEN: ${{ secrets.SITE_FEED_TOKEN }}
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download signed release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release
          path: release-output
      - name: Publish release feed
        run: python3 -m scripts.release.reconcile feed --directory release-output
