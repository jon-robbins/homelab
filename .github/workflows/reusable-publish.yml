name: Reusable byte-copy publisher

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      destination:
        required: true
        type: string
      manifest-digest:
        required: true
        type: string
      run-id:
        required: true
        type: string
      release-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-release
    # Decision 2026-10-11: publish with the job token. packages: write is granted only
    # here, on main, inside the branch-restricted production-release environment.
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download OCI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Verify and promote OCI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_DESTINATION: ${{ inputs.destination }}
          INPUT_RELEASE_SHA: ${{ inputs.release-sha }}
          INPUT_MANIFEST_DIGEST: ${{ inputs.manifest-digest }}
        run: |
          set -euo pipefail
          source="oci-archive:artifact/oci-layout.tar"
          destination="docker://${INPUT_DESTINATION}:sha-${INPUT_RELEASE_SHA}"
          gh attestation verify artifact/oci-layout.tar \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/post-merge-build.yml" \
            --source-digest "$INPUT_RELEASE_SHA"
          skopeo copy --preserve-digests --dest-creds "github-actions:${GITHUB_TOKEN}" "$source" "$destination"
          actual="$(skopeo inspect --creds "github-actions:${GITHUB_TOKEN}" --format '{{.Digest}}' "$destination")"
          test "$actual" = "$INPUT_MANIFEST_DIGEST"
