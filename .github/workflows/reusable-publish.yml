name: Reusable byte-copy publisher

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      destination:
        required: true
        type: string
      manifest-digest:
        required: true
        type: string
      run-id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-release
    # Decision 2026-10-11: publish with the job token. packages: write is granted only
    # here, on main, inside the branch-restricted production-release environment.
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download OCI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Copy and verify OCI artifact
        env:
          GHCR_PUBLISH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release/artifacts.py publish
          --artifact artifact/oci-layout.tar
          --destination "${{ inputs.destination }}"
          --expected-manifest-digest "${{ inputs.manifest-digest }}"
