version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/modules/app", "/modules/edge"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "library/postgres"
        update-types: ["version-update:semver-major"]
    groups:
      stateless:
        patterns:
          - "ghcr.io/flaresolverr/flaresolverr"
  - package-ecosystem: pip
    directory: /config/release
    schedule:
      interval: weekly
