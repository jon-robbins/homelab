version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/modules/app", "/modules/edge"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      stateless:
        patterns:
          - "ghcr.io/flaresolverr/flaresolverr"
  - package-ecosystem: docker
    directory: /apps/homelab-workers
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /apps/homelab-mcp
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /config/caddy
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /config/release
    schedule:
      interval: weekly
