services:
  traefik:
    # Appended to the module's tailnet port: the tunnel-only loopback listener, and the LAN HTTP (container 8080)
    # and LAN TLS (container 8443) listeners this site has always had (all declared in site.yaml exposed).
    ports:
      - "127.0.0.1:9443:5443"
      - "80:8080"
      - "8443:8443"
