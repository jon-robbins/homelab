services:
  radarr:
    environment:
      RADARR__AUTH__METHOD: External
    volumes:
      - type: bind
        source: ${MOVIES_DIR}
        target: /movies
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_DIR}
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_HDD_PATH}/.seed/Seeding
        target: /seeding
        bind:
          create_host_path: false
