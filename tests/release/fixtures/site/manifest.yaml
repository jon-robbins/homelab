schema: 1
applications:
  - name: alpha
    image: ghcr.io/jon-robbins/homelab/homelab-agent
    rollback: automatic
    depends_on: []
    secrets: []
    health_probe: alpha-health
    semantic_probes: [alpha-route]
  - name: beta
    image: ghcr.io/jon-robbins/homelab/homelab-mcp
    rollback: manual
    depends_on: [alpha]
    secrets: []
    health_probe: beta-health
    semantic_probes: [beta-route]
