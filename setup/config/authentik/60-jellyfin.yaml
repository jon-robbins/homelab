# Jellyfin sign-in through the SSO plugin. The client secret is generated by setup (A-11), read here from a
# file, and handed to the plugin from the same file, so nobody copies it out of Authentik by hand.
version: 1
metadata: {name: homelab - jellyfin}
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs: {identifiers: {name: homelab - groups}, required: true}
  - model: authentik_blueprints.metaapplyblueprint
    attrs: {identifiers: {name: Default - Provider authorization flow (implicit consent)}, required: true}
  - model: authentik_blueprints.metaapplyblueprint
    attrs: {identifiers: {name: Default - Provider invalidation flow}, required: true}
  - model: authentik_blueprints.metaapplyblueprint
    attrs: {identifiers: {name: System - OAuth2 Provider - Scopes}, required: true}
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-jellyfin
    state: present
    identifiers: {name: jellyfin}
    attrs:
      client_id: jellyfin
      client_type: confidential
      client_secret: !File /run/secrets/JELLYFIN_OIDC_CLIENT_SECRET
      grant_types: [authorization_code]
      redirect_uris:
        - {matching_mode: strict, url: "$jellyfin_url/sso/OID/redirect/authentik"}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app-jellyfin
    state: present
    identifiers: {slug: jellyfin}
    attrs: {name: Jellyfin, provider: !KeyOf provider-jellyfin, meta_launch_url: "$jellyfin_url"}
  - model: authentik_policies.policybinding
    state: present
    identifiers: {target: !KeyOf app-jellyfin, order: 0}
    attrs: {group: !Find [authentik_core.group, [name, family]]}
  - model: authentik_policies.policybinding
    state: present
    identifiers: {target: !KeyOf app-jellyfin, order: 10}
    attrs: {group: !Find [authentik_core.group, [name, admins]]}
